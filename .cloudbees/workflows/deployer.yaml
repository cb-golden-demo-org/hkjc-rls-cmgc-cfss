apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deployer
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      manifest:
        type: string
        required: true

jobs:
  hackers-web:
    if: ${{ fromJSON(inputs.manifest)['hkjc_rls_cmgc_cfss_cess-frontend-tr']['hackers-web'].deploy }}
    uses: cb-golden-demo-org/hkjc_rls_cmgc_cfss_cess-frontend-tr/.cloudbees/workflows/deploy.yaml
    with:
      artifact-url: ${{ fromJSON(inputs.manifest)['hkjc_rls_cmgc_cfss_cess-frontend-tr']['hackers-web'].url }}
      artifact-id: ${{ fromJSON(inputs.manifest)['hkjc_rls_cmgc_cfss_cess-frontend-tr']['hackers-web'].id }}
      environment: ${{ inputs.environment }}
    secrets: inherit
    vars: inherit
  hackers-api:
    if: ${{ fromJSON(inputs.manifest)['hkjc_rls_cmgc_cfss_cfss-feerate-tr']['hackers-api'].deploy }}
    uses: cb-golden-demo-org/hkjc_rls_cmgc_cfss_cfss-feerate-tr/.cloudbees/workflows/deploy.yaml
    with:
      artifact-url: ${{ fromJSON(inputs.manifest)['hkjc_rls_cmgc_cfss_cfss-feerate-tr']['hackers-api'].url }}
      artifact-id: ${{ fromJSON(inputs.manifest)['hkjc_rls_cmgc_cfss_cfss-feerate-tr']['hackers-api'].id }}
      environment: ${{ inputs.environment }}
    secrets: inherit
    vars: inherit
