apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Deploy Payment

on:
  workflow_call:
    inputs:
      artifact-url:
        type: string
        required: true
      artifact-id:
        type: string
        required: true
      environment:
        type: string
        required: true

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    steps:
      - name: Trigger and wait for GitHub Actions deploy
        uses: docker://alpine:3.20
        env:
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
          ARTIFACT_URL: ${{ inputs.artifact-url }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          apk add --no-cache curl jq

          curl -s -X POST \
            -H "Authorization: Bearer $GH_DEPLOY_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/cb-golden-demo-org/lsa26-travelenterprise-app/actions/workflows/deploy-payment.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"artifact_url\":\"$ARTIFACT_URL\",\"environment\":\"$ENVIRONMENT\"}}"

          echo "Waiting for run to register..."
          sleep 20

          RUN_ID=$(curl -s \
            -H "Authorization: Bearer $GH_DEPLOY_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/cb-golden-demo-org/lsa26-travelenterprise-app/actions/workflows/deploy-payment.yml/runs?event=workflow_dispatch&per_page=1" \
            | jq -r '.workflow_runs[0].id')
          echo "Tracking run ID: $RUN_ID"

          for i in $(seq 1 60); do
            RUN=$(curl -s \
              -H "Authorization: Bearer $GH_DEPLOY_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/cb-golden-demo-org/lsa26-travelenterprise-app/actions/runs/$RUN_ID")
            STATUS=$(echo "$RUN" | jq -r '.status')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')
            echo "[$i/60] status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              [ "$CONCLUSION" = "success" ] && exit 0 || { echo "Deploy failed: $CONCLUSION"; exit 1; }
            fi
            sleep 15
          done
          echo "Timeout after 15 minutes"
          exit 1

      - name: Register deployed artifact
        uses: cloudbees-io/register-deployed-artifact@v2
        with:
          artifact-id: ${{ inputs.artifact-id }}

      - name: Publish deployment evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Deployed — travel-payment
            - **Image**: `${{ inputs.artifact-url }}`
            - **Environment**: ${{ inputs.environment }}
            - **URL**: https://core.cloudbees.guru/${{ inputs.environment }}/payment
