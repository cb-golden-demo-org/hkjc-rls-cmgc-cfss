apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: cmgc_release_workflow
on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: |
          System-generated parameter required for application releases. See https://docs.cloudbees.com/docs/cloudbees-platform/latest/applications/releases#manifest
      Release_Train:
        type: string
        required: true
        description: Release train that this release is under.
      Sprint:
        type: string
        required: true
        description: Sprint number
      Release_Candidate:
        type: string
        required: true
        description: Release candidate
metadata:
  stages/v1alpha1:
    - name: Readiness
      jobs:
        - gather-evidence
        - quality-gate
        - approval
    - name: DITS
      jobs:
        - deploy-to-dits
        - run-tests-dits
        - exit-criteria-dits
    - name: ITWS-INT1
      jobs:
        - ITWS-INT1-manager-approval
        - deploy-to-ITWS-INT1
        - run-tests-ITWS-INT1
        - exit-criteria-ITWS-INT1
    - name: AUT
      jobs:
        - AUT-manager-approval
        - deploy-to-AUT
        - run-tests-AUT
        - exit-criteria-AUT
    - name: SIT
      jobs:
        - SIT-manager-approval
        - deploy-to-SIT
        - run-tests-SIT
        - exit-criteria-SIT
    - name: UAT1
      jobs:
        - UAT1-manager-approval
        - deploy-to-UAT1
        - run-tests-UAT1
        - exit-criteria-UAT1    
    - name: UAT2
      jobs:
        - UAT2-manager-approval
        - deploy-to-UAT2
        - run-tests-UAT2
        - exit-criteria-UAT2
    - name: SAT1
      jobs:
        - SAT1-manager-approval
        - deploy-to-SAT1
        - run-tests-SAT1
        - exit-criteria-SAT1
    - name: PROD
      jobs:
        - wait-for-snow-change-request
        - deploy-to-prod
        - run-smoke-tests-prod
        - PROD-deployment-closure

jobs:
  gather-evidence:
    steps:
      - name: Gather build evidence
        uses: docker://alpine:3.20
        run: |
          apk add --no-cache jq
          echo "Manifest received:"
          echo '${{ inputs.manifest }}' | jq .
      - name: Fetch Jira tickets per artifact
        id: jira-tickets
        uses: docker://alpine:3.20
        env:
          MANIFEST: ${{ inputs.manifest }}
          CLOUDBEES_API_TOKEN: ${{ secrets.CLOUDBEES_API_TOKEN }}
        run: |
          apk add --no-cache curl jq
          BASE="https://api.cloudbees.io"
          TABLE="/tmp/jira-table.md"

          echo "## Jira Tickets" > "$TABLE"
          echo "" >> "$TABLE"

          printf "%s" "$MANIFEST" | jq -r '
            to_entries[] |
            . as $comp |
            $comp.value | to_entries[] |
            select(.key != "deploy" and .key != "id") |
            select(.value | type == "object") |
            [$comp.key, $comp.value.id, .value.id, .value.version] |
            @tsv
          ' | while IFS=$(printf '\t') read -r comp_name comp_id artifact_id version; do

            printf "### %s - %s\n\n" "$comp_name" "$version" >> "$TABLE"

            RESP=$(curl -sf \
              -H "Authorization: Bearer ${CLOUDBEES_API_TOKEN}" \
              -H "Accept: application/json" \
              "${BASE}/v3/components/${comp_id}/artifactinfos/${artifact_id}/tickets" \
              || echo '{"tickets":[]}')

            COUNT=$(printf '%s' "$RESP" | jq '.tickets | length')

            if [ "$COUNT" -eq 0 ]; then
              echo "_No Jira tickets linked to this artifact._" >> "$TABLE"
            else
              echo "| Ticket | Title | Status |" >> "$TABLE"
              echo "|--------|-------|--------|" >> "$TABLE"
              printf '%s' "$RESP" | jq -r '.tickets[] |
                "| [\(.externalId)](\(.url)) | \(.title) | \(.externalStatus) |"' >> "$TABLE"
            fi
            echo "" >> "$TABLE"
          done

          cat "$TABLE"
          cp "$TABLE" "$CLOUDBEES_OUTPUTS/table"
      - name: Publish release evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Release Evidence - Travel Enterprise
            - **Run**: #${{ cloudbees.run_number }}
            - **Branch**: ${{ cloudbees.scm.branch }}
            - **Commit**: ${{ cloudbees.scm.sha }}

            ### Components in manifest
            ```json
            ${{ inputs.manifest }}
            ```

            ${{ steps.jira-tickets.outputs.table }}
  quality-gate:
    needs: gather-evidence
    steps:
      - name: Security scan
        uses: docker://alpine:3.20
        run: |
          echo "Running security checks..."
          sleep 2
          echo "Critical: 0 | High: 0 | Medium: 2 | Low: 8"
          echo "Security gate: PASSED"
      - name: Dependency audit
        uses: docker://alpine:3.20
        run: |
          echo "Auditing dependencies..."
          sleep 1
          echo "No critical vulnerabilities found"
      - name: Publish quality evidence
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Quality Gate
            | Check | Result |
            |-------|--------|
            | Security scan | PASSED (0 critical) |
            | Dependency audit | PASSED |
            | Code quality | PASSED |
  approval:
    needs: quality-gate
    timeout-minutes: 60
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      instructions: Review quality evidence above before approving release to QA.
      disallowLaunchByUser: false
  deploy-to-dits:
    needs: approval
    steps:
      - run: echo "deploying to dits environment"
        uses: docker://golang:1.20.3-alpine3.17
        name: Deploy to DITS
        shell: sh
  run-tests-dits:
    needs: deploy-to-dits
    steps:
      - run: echo "Running Test on DITS"
        uses: docker://golang:1.20.3-alpine3.17
        name: Run Test on DITS
        shell: sh
  exit-criteria-dits:
    needs: run-tests-dits
    steps:
      - run: |
          echo "DITS Test Exit Criteria:"
          echo "  Smoke tests: PASSED"
          echo "  Health checks: PASSED"
          echo "  No P1 issues: CONFIRMED"
          echo "DITS test gate: PASSED - ready for next stage deployment"
        uses: docker://alpine:3.20
        name: Evaluate DITS exit criteria
      - with:
          content: |-
            ## DITS Test Exit Criteria
            - Smoke tests: PASSED
            - Health checks: PASSED
            - No blocking issues
            **Result: APPROVED for next stage deployment **
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        name: Publish exit criteria
  ITWS-INT1-manager-approval:
    needs:
      - exit-criteria-dits
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      instructions: Approve to promote to ITWS-INT1.
      disallowLaunchByUser: false
  deploy-to-ITWS-INT1:
    needs:
      - ITWS-INT1-manager-approval
    steps:
      - run: echo "deploying to ITWS-INT1 environment"
        uses: docker://golang:1.20.3-alpine3.17
        name: Deploy to ITWS-INT1
        shell: sh
  run-tests-ITWS-INT1:
    environment: ITWS-INT1
    needs:
      - deploy-to-ITWS-INT1
    steps:
      - run: echo "Running ITWS-INT1 tests ..."
        uses: docker://golang:1.20.3-alpine3.17
        name: Run ITWS-INT1 tests
        shell: sh
  exit-criteria-ITWS-INT1:
    environment: ITWS-INT1
    needs:
      - run-tests-ITWS-INT1
    steps:
      - name: Evaluate ITWS-INT1 exit criteria
        uses: docker://alpine:3.20
        run: |
          echo "ITWS-INT1 Exit Criteria:"
          echo "  E2E tests: PASSED"
          echo "  Risk level: LOW"
          echo "  Gate PASSED and ready for AUT"
      - name: Publish exit criteria
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## ITWS-INT1 Exit Criteria
            - E2E tests: PASSED
            - Risk assessment: LOW
            **Result: APPROVED for AUT**  
  AUT-manager-approval:
    needs:
      - exit-criteria-ITWS-INT1
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      instructions: Approve to promote to AUT.
      disallowLaunchByUser: false
  deploy-to-AUT:
    needs:
      - AUT-manager-approval
    steps:
      - run: echo "deploying to AUT environment"
        uses: docker://golang:1.20.3-alpine3.17
        name: Deploy to AUT
        shell: sh
  run-tests-AUT:
    environment: AUT
    needs:
      - deploy-to-AUT
    steps:
      - run: echo "Running AUT tests ..."
        uses: docker://golang:1.20.3-alpine3.17
        name: Run AUT tests
        shell: sh
  exit-criteria-AUT:
    environment: AUT
    needs:
      - run-tests-AUT
    steps:
      - name: Evaluate AUT exit criteria
        uses: docker://alpine:3.20
        run: |
          echo "AUT Exit Criteria:"
          echo "  E2E tests: PASSED"
          echo "  Risk level: LOW"
          echo "  Gate PASSED and ready for SIT"
      - name: Publish exit criteria
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## AUT Exit Criteria
            - E2E tests: PASSED
            - Risk assessment: LOW
            **Result: APPROVED for SIT**  
  SIT-manager-approval:
    needs:
      - exit-criteria-AUT
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      instructions: Approve to promote to SIT.
      disallowLaunchByUser: false
  deploy-to-SIT:
    needs:
      - SIT-manager-approval
    steps:
      - run: echo "deploying to SIT environment"
        uses: docker://golang:1.20.3-alpine3.17
        name: Deploy to SIT
        shell: sh
  run-tests-SIT:
    environment: SIT
    needs:
      - deploy-to-SIT
    steps:
      - run: echo "Running SIT tests ..."
        uses: docker://golang:1.20.3-alpine3.17
        name: Run SIT tests
        shell: sh
  exit-criteria-SIT:
    environment: SIT
    needs:
      - run-tests-SIT
    steps:
      - name: Evaluate SIT exit criteria
        uses: docker://alpine:3.20
        run: |
          echo "AUT Exit Criteria:"
          echo "  E2E tests: PASSED"
          echo "  Risk level: LOW"
          echo "  Gate PASSED and ready for UAT1"
      - name: Publish exit criteria
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## SIT Exit Criteria
            - E2E tests: PASSED
            - Risk assessment: LOW
            **Result: APPROVED for UAT1**
  UAT1-manager-approval:
    needs:
      - exit-criteria-SIT
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      instructions: Approve to promote to UAT1.
      disallowLaunchByUser: false
  deploy-to-UAT1:
    needs:
      - UAT1-manager-approval
    steps:
      - run: echo "deploying to UAT1 environment"
        uses: docker://golang:1.20.3-alpine3.17
        name: Deploy to UAT1
        shell: sh
  run-tests-UAT1:
    environment: UAT1
    needs:
      - deploy-to-UAT1
    steps:
      - run: echo "Running UAT1 tests ..."
        uses: docker://golang:1.20.3-alpine3.17
        name: Run UAT1 tests
        shell: sh
  exit-criteria-UAT1:
    environment: UAT1
    needs:
      - run-tests-UAT1
    steps:
      - name: Evaluate UAT1 exit criteria
        uses: docker://alpine:3.20
        run: |
          echo "AUT Exit Criteria:"
          echo "  E2E tests: PASSED"
          echo "  Risk level: LOW"
          echo "  Gate PASSED and ready for UAT2"
      - name: Publish exit criteria
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## UAT1 Exit Criteria
            - E2E tests: PASSED
            - Risk assessment: LOW
            **Result: APPROVED for UAT2**
  UAT2-manager-approval:
    needs:
      - exit-criteria-UAT1
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      instructions: Approve to promote to UAT2.
      disallowLaunchByUser: false
  deploy-to-UAT2:
    needs:
      - UAT2-manager-approval
    steps:
      - run: echo "deploying to UAT2 environment"
        uses: docker://golang:1.20.3-alpine3.17
        name: Deploy to UAT2
        shell: sh
  run-tests-UAT2:
    environment: UAT2
    needs:
      - deploy-to-UAT2
    steps:
      - run: echo "Running UAT2 tests ..."
        uses: docker://golang:1.20.3-alpine3.17
        name: Run UAT2 tests
        shell: sh
  exit-criteria-UAT2:
    environment: UAT2
    needs:
      - run-tests-UAT2
    steps:
      - name: Evaluate UAT2 exit criteria
        uses: docker://alpine:3.20
        run: |
          echo "AUT Exit Criteria:"
          echo "  E2E tests: PASSED"
          echo "  Risk level: LOW"
          echo "  Gate PASSED and ready for SAT"
      - name: Publish exit criteria
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## UAT2 Exit Criteria
            - E2E tests: PASSED
            - Risk assessment: LOW
            **Result: APPROVED for SAT**
  SAT1-manager-approval:
    needs:
      - exit-criteria-UAT2
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      instructions: Approve to promote to SAT1.
      disallowLaunchByUser: false
  deploy-to-SAT1:
    needs:
      - SAT1-manager-approval
    steps:
      - run: echo "deploying to SAT1 environment"
        uses: docker://golang:1.20.3-alpine3.17
        name: Deploy to SAT1
        shell: sh
  run-tests-SAT1:
    environment: SAT1
    needs:
