  exit-criteria-SAT1:
    environment: SAT1
    needs:
      - run-tests-SAT1
    steps:
      - name: Evaluate SAT1 exit criteria
        uses: docker://alpine:3.20
        run: |
          echo "AUT Exit Criteria:"
          echo "  E2E tests: PASSED"
          echo "  Performance tests: PASSED"
          echo "  Risk level: LOW"
          echo "  Gate PASSED and ready for PROD"
      - name: Publish exit criteria
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## SAT1 Exit Criteria
            - E2E tests: PASSED
            - Performance thresholds: PASSED
            - Risk assessment: LOW
            **Result: APPROVED for PROD**
  wait-for-snow-change-request:
    needs: [exit-criteria-SAT1]
    uses: cb-golden-demo-org/hackers-klee-rodemo-app/.cloudbees/workflows/sn-approval.yaml
    secrets: inherit
    vars: inherit
  deploy-to-prod:
    needs: [wait-for-snow-change-request]
    steps:
      - run: echo "deploying to PROD environment"
        uses: docker://golang:1.20.3-alpine3.17
        name: Deploy to PROD
        shell: sh
  run-smoke-tests-prod:
