name: Deploy Monitoring Stack (Grafana + Loki)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/776612895557/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-traveldemo@cloudbees-sa-emea-demo.iam.gserviceaccount.com

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: cloudbees-core
          location: europe-west1-d
          project_id: cloudbees-sa-emea-demo

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Add Grafana Helm repo
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Create monitoring namespace
        run: |
          kubectl apply -f k8s/monitoring/namespace.yaml

      - name: Create Grafana dashboards ConfigMap
        run: |
          kubectl apply -f k8s/monitoring/grafana-dashboards-configmap.yaml

      - name: Deploy Loki stack (Loki + Promtail + Grafana)
        env:
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          helm upgrade --install loki grafana/loki-stack \
            --namespace monitoring \
            --values k8s/monitoring/loki-stack-values.yaml \
            --set grafana.adminUser="$GRAFANA_ADMIN_USER" \
            --set grafana.adminPassword="$GRAFANA_ADMIN_PASSWORD" \
            --wait \
            --timeout 10m

      - name: Grafana URL
        run: |
          echo "✅ Grafana is available at: http://core.cloudbees.guru/grafana"

      - name: Verify deployment
        run: |
          echo "=== Pods in monitoring namespace ==="
          kubectl get pods -n monitoring
          echo ""
          echo "=== Services ==="
          kubectl get svc -n monitoring
          echo ""
          echo "=== Promtail DaemonSet ==="
          kubectl get daemonset -n monitoring
