name: Deploy Frontend to GKE

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        required: true
        type: string
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/776612895557/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-traveldemo@cloudbees-sa-emea-demo.iam.gserviceaccount.com

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: cloudbees-core
          location: europe-west1-d
          project_id: cloudbees-sa-emea-demo

      - name: Select ROX_SDK_KEY for environment
        id: rox
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ROX_QA: ${{ secrets.ROX_SDK_KEY_QA }}
          ROX_STG: ${{ secrets.ROX_SDK_KEY_STG }}
          ROX_PRD: ${{ secrets.ROX_SDK_KEY_PRD }}
        run: |
          case "$ENVIRONMENT" in
            travel-enterprise-qa)  echo "key=$ROX_QA"  >> $GITHUB_OUTPUT ;;
            travel-enterprise-stg) echo "key=$ROX_STG" >> $GITHUB_OUTPUT ;;
            travel-enterprise-prd) echo "key=$ROX_PRD" >> $GITHUB_OUTPUT ;;
          esac

      - name: Deploy to GKE
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          ENVIRONMENT: ${{ inputs.environment }}
          ROX_SDK_KEY: ${{ steps.rox.outputs.key }}
        run: |
          NAMESPACE="${ENVIRONMENT}"

          # Frontend ingress — no rewrite (app handles path base)
          kubectl apply -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: travel-enterprise-frontend
            namespace: ${NAMESPACE}
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              kubernetes.io/ingress.class: nginx
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
          spec:
            rules:
            - host: core.cloudbees.guru
              http:
                paths:
                - path: /${NAMESPACE}
                  pathType: Prefix
                  backend:
                    service:
                      name: travel-frontend-svc
                      port:
                        number: 80
          EOF

          # Backend ingress — rewrite strips /$NAMESPACE/api prefix
          kubectl apply -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: travel-enterprise-backend
            namespace: ${NAMESPACE}
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              kubernetes.io/ingress.class: nginx
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
              nginx.ingress.kubernetes.io/rewrite-target: /\$2
          spec:
            rules:
            - host: core.cloudbees.guru
              http:
                paths:
                - path: /${NAMESPACE}/api(/|$)(.*)
                  pathType: ImplementationSpecific
                  backend:
                    service:
                      name: travel-backend-svc
                      port:
                        number: 80
          EOF

          # Payment ingress — rewrite strips /$NAMESPACE/payment prefix
          kubectl apply -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: travel-enterprise-payment
            namespace: ${NAMESPACE}
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              kubernetes.io/ingress.class: nginx
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
              nginx.ingress.kubernetes.io/rewrite-target: /\$2
          spec:
            rules:
            - host: core.cloudbees.guru
              http:
                paths:
                - path: /${NAMESPACE}/payment(/|$)(.*)
                  pathType: ImplementationSpecific
                  backend:
                    service:
                      name: travel-payment-svc
                      port:
                        number: 80
          EOF

          # Ensure services target port 8080 (ASP.NET Core)
          for SVC in travel-frontend-svc travel-backend-svc travel-payment-svc; do
            kubectl patch svc $SVC -n $NAMESPACE --type='json' \
              -p='[{"op":"replace","path":"/spec/ports/0/targetPort","value":8080}]' 2>/dev/null || true
          done

          kubectl set env deployment/travel-frontend \
            ROX_SDK_KEY=$ROX_SDK_KEY \
            ASPNETCORE_PATHBASE=/$NAMESPACE \
            -n $NAMESPACE
          kubectl set image deployment/travel-frontend travel-frontend=$ARTIFACT_URL -n $NAMESPACE
          kubectl rollout status deployment/travel-frontend -n $NAMESPACE --timeout=5m

      - name: Verify pods
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          kubectl get pods -n travel-${ENVIRONMENT} -l app=travel-frontend
